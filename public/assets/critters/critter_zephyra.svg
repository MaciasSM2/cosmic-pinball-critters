<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWind" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#241002" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="electricGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#bgWind)" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="7,3" opacity="0.7"/>

  <!-- Celestial Thunderbird Crest Feathers -->
  <path d="M50,85 C25,50 40,15 70,25 C85,35 85,65 75,85 Z" fill="url(#featherGrad)"/>
  <path d="M150,85 C175,50 160,15 130,25 C115,35 115,65 125,85 Z" fill="url(#featherGrad)"/>
  <path d="M100,50 C90,15 110,15 100,50 Z" fill="#ffffff" filter="url(#electricGlow)"/>

  <!-- Main Hawk Head & Wings Silhouette -->
  <path d="M45,115 C25,85 55,40 100,30 C145,40 175,85 155,115 C175,135 160,165 130,170 C100,175 70,170 45,115 Z" fill="url(#featherGrad)" filter="url(#electricGlow)"/>

  <!-- Inner Mask & Beak -->
  <polygon points="100,65 130,105 100,155 70,105" fill="#3b1d03" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="100,110 114,145 100,160 86,145" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>

  <!-- Piercing Lightning Eyes -->
  <polygon points="80,95 94,92 90,102" fill="#ffffff" filter="url(#electricGlow)"/>
  <polygon points="120,95 106,92 110,102" fill="#ffffff" filter="url(#electricGlow)"/>

  <!-- Lightning Bolt Cheeks -->
  <path d="M68,110 L78,118 L72,128 L84,124" fill="none" stroke="#ffffff" stroke-width="2.5" filter="url(#electricGlow)"/>
  <path d="M132,110 L122,118 L128,128 L116,124" fill="none" stroke="#ffffff" stroke-width="2.5" filter="url(#electricGlow)"/>

  <!-- Static Sparks -->
  <circle cx="40" cy="55" r="3" fill="#ffffff" filter="url(#electricGlow)"/>
  <circle cx="160" cy="55" r="3" fill="#ffffff" filter="url(#electricGlow)"/>
  <circle cx="32" cy="120" r="2.5" fill="#fde047"/>
  <circle cx="168" cy="120" r="2.5" fill="#fde047"/>
</svg>
