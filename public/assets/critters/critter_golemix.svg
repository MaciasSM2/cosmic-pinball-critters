<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgEarth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#021f18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#bgEarth)" stroke="#10b981" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>

  <!-- Boulder Shoulders & Armor -->
  <polygon points="35,110 50,65 85,85 70,140" fill="url(#stoneGrad)" stroke="#1e293b" stroke-width="2"/>
  <polygon points="165,110 150,65 115,85 130,140" fill="url(#stoneGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Ancient Granite Head -->
  <polygon points="100,35 145,75 135,145 100,165 65,145 55,75" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="3"/>

  <!-- Moss Crest -->
  <path d="M70,70 Q100,45 130,70 Q100,60 70,70 Z" fill="#059669"/>

  <!-- Glowing Emerald Horns -->
  <polygon points="55,60 40,25 65,45" fill="url(#runeGrad)" filter="url(#runeGlow)"/>
  <polygon points="145,60 160,25 135,45" fill="url(#runeGrad)" filter="url(#runeGlow)"/>

  <!-- Ancient Carved Forehead Rune -->
  <path d="M100,55 L108,70 L100,82 L92,70 Z M100,48 L100,55" fill="none" stroke="#34d399" stroke-width="3" filter="url(#runeGlow)"/>

  <!-- Tectonic Eyes -->
  <polygon points="76,96 92,92 88,104" fill="#a7f3d0" filter="url(#runeGlow)"/>
  <polygon points="124,96 108,92 112,104" fill="#a7f3d0" filter="url(#runeGlow)"/>

  <!-- Stone Jaw & Cracks -->
  <line x1="100" y1="120" x2="100" y2="148" stroke="#10b981" stroke-width="2.5" filter="url(#runeGlow)"/>
  <line x1="88" y1="130" x2="112" y2="130" stroke="#10b981" stroke-width="2.5" filter="url(#runeGlow)"/>

  <!-- Floating Earth Gem Shards -->
  <polygon points="45,45 52,38 48,50" fill="#34d399" filter="url(#runeGlow)"/>
  <polygon points="155,45 148,38 152,50" fill="#34d399" filter="url(#runeGlow)"/>
</svg>
