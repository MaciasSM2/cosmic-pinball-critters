<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSolar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="goldCorona" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="solarBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#bgSolar)" stroke="#fde047" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Radiating Sun Rays (8 Rays) -->
  <g filter="url(#solarBloom)">
    <polygon points="100,10 106,35 94,35" fill="#ffffff"/>
    <polygon points="100,190 106,165 94,165" fill="#fde047"/>
    <polygon points="10,100 35,106 35,94" fill="#fde047"/>
    <polygon points="190,100 165,106 165,94" fill="#fde047"/>
    <polygon points="36,36 58,52 48,62" fill="#fde047"/>
    <polygon points="164,36 142,52 152,62" fill="#fde047"/>
    <polygon points="36,164 58,148 48,138" fill="#fde047"/>
    <polygon points="164,164 142,148 152,138" fill="#fde047"/>
  </g>

  <!-- Celestial Sun Lion Mane -->
  <path d="M50,110 C25,70 60,30 100,20 C140,30 175,70 150,110 C170,140 145,170 120,175 C100,180 80,175 50,140 Z" fill="url(#goldCorona)" filter="url(#solarBloom)"/>

  <!-- Royal Mask & Crown -->
  <polygon points="100,50 135,95 125,145 100,165 75,145 65,95" fill="#422006" stroke="#fde047" stroke-width="2.5"/>

  <!-- Crown Diadem -->
  <polygon points="80,55 90,38 100,48 110,38 120,55 100,62" fill="#ffffff" filter="url(#solarBloom)"/>
  <circle cx="100" cy="52" r="3.5" fill="#00f2fe"/>

  <!-- Divine White Eyes -->
  <ellipse cx="85" cy="95" rx="7" ry="5" fill="#ffffff" filter="url(#solarBloom)"/>
  <ellipse cx="115" cy="95" rx="7" ry="5" fill="#ffffff" filter="url(#solarBloom)"/>

  <!-- Solar Whisker Flares -->
  <line x1="75" y1="115" x2="55" y2="120" stroke="#fde047" stroke-width="2" filter="url(#solarBloom)"/>
  <line x1="75" y1="125" x2="60" y2="135" stroke="#fde047" stroke-width="2" filter="url(#solarBloom)"/>
  <line x1="125" y1="115" x2="145" y2="120" stroke="#fde047" stroke-width="2" filter="url(#solarBloom)"/>
  <line x1="125" y1="125" x2="140" y2="135" stroke="#fde047" stroke-width="2" filter="url(#solarBloom)"/>
</svg>
