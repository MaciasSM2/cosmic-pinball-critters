<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#180408" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#fff275"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="60%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)" stroke="#ff4500" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Back Horns / Spikes -->
  <path d="M55,60 C40,25 20,20 15,35 C25,50 45,65 58,72 Z" fill="url(#hornGrad)"/>
  <path d="M145,60 C160,25 180,20 185,35 C175,50 155,65 142,72 Z" fill="url(#hornGrad)"/>

  <!-- Flaming Mane -->
  <path d="M60,110 C45,70 70,40 100,25 C130,40 155,70 140,110 C155,100 170,125 155,145 C140,165 125,170 100,175 C75,170 60,165 45,145 C30,125 45,100 60,110 Z" fill="url(#flameGrad)" filter="url(#fireGlow)"/>

  <!-- Head Base -->
  <polygon points="100,55 135,95 125,140 100,160 75,140 65,95" fill="#260408" stroke="#ff4500" stroke-width="2.5"/>

  <!-- Inner Magma Markings -->
  <path d="M100,70 L115,95 L100,120 L85,95 Z" fill="#ff7b00" opacity="0.9"/>
  <path d="M100,80 L108,95 L100,110 L92,95 Z" fill="#fffb8f"/>

  <!-- Burning Eyes -->
  <polygon points="78,92 92,98 84,103 76,98" fill="#fffb8f" filter="url(#fireGlow)"/>
  <polygon points="122,92 108,98 116,103 124,98" fill="#fffb8f" filter="url(#fireGlow)"/>

  <!-- Brow & Snout Shading -->
  <path d="M72,88 L100,102 L128,88" fill="none" stroke="#ff3700" stroke-width="3" stroke-linecap="round"/>
  <polygon points="100,132 94,124 106,124" fill="#ff5500"/>

  <!-- Embers / Sparks -->
  <circle cx="50" cy="45" r="3" fill="#ffdd00" filter="url(#fireGlow)"/>
  <circle cx="155" cy="50" r="2.5" fill="#ffdd00" filter="url(#fireGlow)"/>
  <circle cx="35" cy="115" r="3.5" fill="#ff4500" filter="url(#fireGlow)"/>
  <circle cx="165" cy="110" r="3" fill="#ff7700" filter="url(#fireGlow)"/>
</svg>
