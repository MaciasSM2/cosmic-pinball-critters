<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#031525" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="waterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#bgWater)" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>

  <!-- Water Crest Waves / Fins -->
  <path d="M40,75 C25,45 45,25 65,35 C80,45 80,70 70,85 Z" fill="url(#waterFlow)" opacity="0.85"/>
  <path d="M160,75 C175,45 155,25 135,35 C120,45 120,70 130,85 Z" fill="url(#waterFlow)" opacity="0.85"/>

  <!-- Main Water Crown -->
  <path d="M50,110 C35,80 60,40 100,20 C140,40 165,80 150,110 C165,130 150,165 120,172 C100,178 80,172 50,150 C35,135 40,120 50,110 Z" fill="url(#waterFlow)" filter="url(#waterGlow)"/>

  <!-- Aquatic Dragon Head -->
  <path d="M100,50 C125,75 128,115 100,150 C72,115 75,75 100,50 Z" fill="#082f49" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Bioluminescent Ice Crystals -->
  <polygon points="100,32 107,52 100,65 93,52" fill="url(#crystalGrad)" filter="url(#waterGlow)"/>
  <polygon points="76,60 84,72 78,82 72,72" fill="url(#crystalGrad)"/>
  <polygon points="124,60 116,72 122,82 128,72" fill="url(#crystalGrad)"/>

  <!-- Luminous Eyes -->
  <ellipse cx="86" cy="98" rx="7" ry="5" fill="#38bdf8" filter="url(#waterGlow)"/>
  <ellipse cx="114" cy="98" rx="7" ry="5" fill="#38bdf8" filter="url(#waterGlow)"/>
  <circle cx="87" cy="97" r="2.5" fill="#ffffff"/>
  <circle cx="113" cy="97" r="2.5" fill="#ffffff"/>

  <!-- Floating Water Bubbles -->
  <circle cx="48" cy="52" r="5" fill="#bae6fd" opacity="0.8"/>
  <circle cx="152" cy="56" r="4" fill="#bae6fd" opacity="0.8"/>
  <circle cx="38" cy="135" r="4" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="162" cy="130" r="5.5" fill="#7dd3fc" opacity="0.7"/>
</svg>
