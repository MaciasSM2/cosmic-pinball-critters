<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#eab308"/>
      <stop offset="90%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Coin Edge -->
  <circle cx="50" cy="50" r="46" fill="url(#coinGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#coinGlow)"/>

  <!-- Inner Beveled Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#fef9c3" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Embossed Arcade Star -->
  <polygon points="50,22 56,36 71,37 59,47 63,62 50,53 37,62 41,47 29,37 44,36" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="50" cy="45" r="4" fill="#ffffff"/>

  <!-- Specular Highlight -->
  <ellipse cx="32" cy="28" rx="10" ry="5" transform="rotate(-30 32 28)" fill="#ffffff" opacity="0.6"/>
</svg>
