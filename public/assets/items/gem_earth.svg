<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="earthFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="earthFacet2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="earthGemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Emerald Cut Octagon -->
  <polygon points="32,12 68,12 88,32 88,68 68,88 32,88 12,68 12,32" fill="url(#earthFacet1)" filter="url(#earthGemGlow)"/>
  <polygon points="36,24 64,24 76,36 76,64 64,76 36,76 24,64 24,36" fill="#34d399"/>
  <polygon points="40,32 60,32 68,40 68,60 60,68 40,68 32,60 32,40" fill="url(#earthFacet2)"/>
  <!-- Highlight -->
  <polygon points="36,24 64,24 60,32 40,32" fill="#ffffff" opacity="0.8"/>
</svg>
