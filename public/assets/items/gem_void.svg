<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="voidFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="voidFacet2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <filter id="voidGemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Hexagonal Amethyst Crystal -->
  <polygon points="50,10 85,28 85,72 50,90 15,72 15,28" fill="url(#voidFacet1)" filter="url(#voidGemGlow)"/>
  <polygon points="50,22 75,36 75,64 50,78 25,64 25,36" fill="#c084fc"/>
  <polygon points="50,22 75,36 50,50 25,36" fill="#f3e8ff"/>
  <polygon points="25,36 50,50 50,78 25,64" fill="url(#voidFacet2)"/>
  <polygon points="75,36 50,50 50,78 75,64" fill="#581c87"/>
  <!-- Highlight -->
  <polygon points="50,22 62,29 50,38 38,29" fill="#ffffff" opacity="0.9"/>
</svg>
